<title>RF Recon (beta)</title>
<script>
// Opened straight from the folder (file://) there is no server behind the page: go to the running app, or say how to start it
if (location.protocol === "file:") {
  var rfApp = "http://localhost:8765/", rfHelp = function () {
    var show = function () { document.body.style.cssText = "margin:0;min-height:100vh;padding:1px 16px;background:#12110f";
      document.body.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:28px;border-radius:22px;background:#1f1b17;color:#f4efe8;font:16px/1.5 Segoe UI,system-ui,sans-serif">'
      + '<h1 style="margin:0 0 10px;font-size:26px">RF Recon (beta)</h1><p>This page runs from RF Recon\'s own small server on this PC, so it can\'t work opened from the folder.</p>'
      + '<p><a href="' + rfApp + '" style="color:#f0a07a;font-weight:700;font-size:19px">Open RF Recon (beta)</a> (when it\'s running)</p>'
      + '<p style="color:#c4bbaf">To start it, double-click <b>RF Recon (beta)</b> on the Desktop, in the Start menu, or in the RF Recon folder in File Explorer (G:\\My Drive\\RF Recon). From Google Drive in the browser, open <b>RF Recon (beta) - open on PC or phone</b>.</p></div>'; };
    if (document.body) show(); else document.addEventListener("DOMContentLoaded", show);
  };
  fetch(rfApp + "api/meta", {mode: "no-cors"}).then(function () { location.replace(rfApp); }, rfHelp);
}
</script>

<script>
// The ◐ button's light / dark maps onto skins: light is Daylight, dark is the last dark skin (Smoke by default).
try { var t = localStorage.getItem("theme");
  if (t === "light") DashSkin.set("day"); else if (t === "dark" && DashSkin.get() === "day") DashSkin.set(DashSkin.lastDark());
  document.documentElement.dataset.theme = t || (DashSkin.get() === "day" ? "light" : "dark"); } catch (e) {}
</script>
<style>
/* colours come from the glass theme (static/theme/glass.css); these map RF Recon's names onto it */
:root, :root[data-skin]{
  --panel: var(--g-strong); --chip: var(--wash); --sel: var(--accent-wash); --muted: var(--ink-2);
  --accent-ink: var(--on-accent); --warn: var(--serious); --bad: var(--bad-ink);
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:1001;flex-wrap:wrap}
header h1{font-size:15px;margin:0;letter-spacing:.05em;font-family:var(--mono)}
header h1 span{color:var(--accent)}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.led{width:9px;height:9px;border-radius:50%;background:#8c959f;display:inline-block}
.led.on{background:#2da44e}.led.off{background:#cf222e}.led.busy{background:#bf8700}
main{max-width:1600px;margin:0 auto;padding:10px 14px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.inl{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
input,select,button,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
input[type=checkbox],input[type=radio]{padding:0;width:16px;height:16px;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}
button{cursor:pointer;background:var(--chip)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 11px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.grow{flex:1 1 200px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;user-select:none;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on b{color:inherit}
.chip.off{opacity:.45;text-decoration:line-through}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.fgroup{margin-top:8px}
/* the filter chips fold away (Collapse): rows animate from their height to none, with the kit's motion */
#filterBody{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--t-panel) var(--ease)}
#filterBody>div{min-height:0;overflow:hidden}
#filters.folded #filterBody{grid-template-rows:0fr}
#filterFold .chev{display:inline-block;width:7px;height:7px;margin:0 8px 1px 1px;border:solid currentColor;border-width:0 1.6px 1.6px 0;
  transform:rotate(-135deg) translate(-1px,-1px);transition:transform var(--t-move) var(--ease)}
#filters.folded #filterFold .chev{transform:rotate(45deg) translate(-2px,-2px)}
.fgroup h4{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto;position:sticky;top:46px;background:var(--bg);z-index:1000}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 13px;white-space:nowrap;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.status{color:var(--muted);font-size:13px;margin:6px 0}
.status.err{color:var(--bad)}
.hint{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono)}
h3{font-size:12px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.card .v{font-size:21px;font-weight:650;font-family:var(--mono)}
.card .k{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;margin-top:10px}
.bars div{display:grid;grid-template-columns:150px 1fr 52px;gap:8px;align-items:center;font-size:12px;margin:3px 0;cursor:pointer}
.bars .bar{height:10px;border-radius:3px;background:var(--accent)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);font-weight:600;color:var(--muted);cursor:pointer;font-size:11.5px;z-index:1}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--chip)}
tbody tr.sel{background:var(--sel)}
td.f{font-family:var(--mono);font-weight:600}
td.n{font-family:var(--mono);text-align:right}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--chip);border:1px solid var(--line)}
.tag.v{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
.tag.w{background:var(--warn);color:#fff;border-color:var(--warn)}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px}
#map{height:calc(100vh - 230px);min-height:420px;border-radius:10px;border:1px solid var(--line)}
.side{height:calc(100vh - 230px);min-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.ring{position:sticky;top:0;background:var(--chip);padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);z-index:1}
.item{padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:62px 1fr;gap:2px 8px;font-size:12.5px}
.item:hover,.item.sel{background:var(--sel)}
.item .d{font-family:var(--mono);color:var(--muted);font-size:11.5px}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{grid-column:2;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.legend{background:var(--panel);color:var(--ink);padding:6px 8px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;max-width:240px}
.legend .bar{height:8px;border-radius:3px;background:linear-gradient(90deg,#30123b,#466be3,#29bbec,#31f198,#a3fd3d,#edd03a,#fb8022,#b40426)}
.pinicon{background:var(--accent);border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.filterbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filterbar input{flex:1 1 260px;font-family:var(--mono);font-size:13px}
.filterbar input.ok{border-color:var(--good)}
.filterbar input.bad{border-color:var(--bad)}
.pkts{height:42vh;overflow:auto}
.pane2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tree{font-family:var(--mono);font-size:12px;height:30vh;overflow:auto;padding:6px 8px}
.tree details{margin-left:12px}
.tree summary{cursor:pointer;margin-left:-12px;font-weight:600}
.tree .kv{display:block;white-space:pre-wrap;word-break:break-all;padding-left:4px}
.tree .k{color:var(--muted)}
pre.raw{margin:0;height:30vh;overflow:auto;font-size:11.5px;padding:6px 8px}
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.dash .panel{margin:0}
.w12{grid-column:span 12}.w8{grid-column:span 8}.w6{grid-column:span 6}.w4{grid-column:span 4}
#dashmap{height:360px;border-radius:8px}
svg text{fill:var(--muted);font-size:10px;font-family:system-ui,sans-serif}
#cy{height:calc(100vh - 260px);min-height:480px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:820px;width:calc(100% - 20px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-b{padding:11px 15px;max-height:78vh;overflow:auto}
.kvg{display:grid;grid-template-columns:170px 1fr;gap:3px 12px;font-size:13px}
.kvg div:nth-child(odd){color:var(--muted)}
.sec{margin-top:12px}
.srcrow{display:grid;grid-template-columns:44px minmax(160px,1.4fr) 120px 1.3fr 80px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.switch{position:relative;width:38px;height:22px;display:inline-block;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(16px)}
.log{max-height:300px;overflow:auto;font-size:12.5px}
.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.print-only{display:none}
@media (max-width:900px){
  .mapwrap{grid-template-columns:1fr}
  #map{height:58vh}.side{height:auto;max-height:60vh}
  .w8,.w6,.w4{grid-column:span 12}
  .pane2{grid-template-columns:1fr}
  .srcrow{grid-template-columns:44px 1fr 80px}
  .srcrow .hide-m{display:none}
  .kvg{grid-template-columns:120px 1fr}
  .bars div{grid-template-columns:110px 1fr 44px}
}
/* Phones in the field (and gloves): every control at least 44px to tap. Look score had 0-1 of 38-54 at 390px. */
@media (pointer:coarse), (max-width:600px){
  button,select,input:not([type=checkbox]):not([type=radio]):not([type=range]),.chip,.tabs button,.seg button{min-height:44px}
  button{min-width:44px}
  .chip{padding:4px 12px}
  input[type=checkbox],input[type=radio]{width:22px;height:22px}
  input[type=range]{min-height:32px}
  .leaflet-bar a,.leaflet-touch .leaflet-bar a{width:44px;height:44px;line-height:44px}
  .leaflet-control-layers-toggle,.leaflet-touch .leaflet-control-layers-toggle{width:44px;height:44px}
  .leaflet-control-layers label{min-height:36px;display:flex;align-items:center}
}
@media print{
  header,.tabs,.no-print,#searchPanel,#filters{display:none!important}
  .print-only{display:block}
  body{background:#fff;color:#000}
  th{position:static}
  #view > *:not(#printSheet){display:none!important}
}

dialog{border:1px solid var(--g-border);border-radius:var(--radius);background:var(--g-strong);box-shadow:var(--g-shadow);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
dialog::backdrop{background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dlg-h{background:var(--g-strong);border-bottom-color:var(--grid)}
svg text{fill:var(--ink-2);font-family:var(--font)}
.switch span{background:var(--wash-2)}
.switch input:checked+span:before{background:var(--on-accent)}
.leaflet-container{background:var(--surface);font-family:var(--font)}
.leaflet-bar{border:0!important;border-radius:14px!important;overflow:hidden;box-shadow:var(--g-shadow)!important}
.leaflet-bar a{background:var(--g-strong)!important;color:var(--ink)!important;border-bottom-color:var(--line)!important}
.leaflet-control-layers{background:var(--g-strong)!important;color:var(--ink)!important;border:0!important;border-radius:14px!important;box-shadow:var(--g-shadow)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--g-strong);color:var(--ink);box-shadow:var(--g-shadow)}
.leaflet-control-attribution{background:rgba(0,0,0,.35)!important;color:var(--ink-2)!important}
.leaflet-control-attribution a{color:var(--ink)!important}
/* street map tiles (/tiles/osm/… and the plain /tiles/{z}/… layer) go dark on the dark skins;
   satellite, topo, county lines and radar keep their colours */
:root:not([data-skin="day"]) :is(.leaflet-tile[src*="/tiles/osm/"], .leaflet-tile[src^="/tiles/0"], .leaflet-tile[src^="/tiles/1"], .leaflet-tile[src^="/tiles/2"], .leaflet-tile[src^="/tiles/3"], .leaflet-tile[src^="/tiles/4"], .leaflet-tile[src^="/tiles/5"], .leaflet-tile[src^="/tiles/6"], .leaflet-tile[src^="/tiles/7"], .leaflet-tile[src^="/tiles/8"], .leaflet-tile[src^="/tiles/9"]){filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.86) saturate(.55)}
@media print{#backdrop{display:none}html{background:#fff}}
/* signed in through the remote link: view and search only, so the parts that change things or stay on the PC go */
body.remote :is(nav [data-t="data"], #takPush){display:none!important}

<link rel="stylesheet" href="web.css">
<link rel="icon" href="../icons/icon-192.png">
</head>
<body>
<div id="backdrop" aria-hidden="true">
  <div class="scene s-room">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="bd-sw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14110e"/><stop offset=".62" stop-color="#2b231b"/><stop offset=".64" stop-color="#3a2f24"/><stop offset="1" stop-color="#16120e"/></linearGradient>
        <linearGradient id="bd-win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6dccb"/><stop offset="1" stop-color="#b9a68a"/></linearGradient>
        <radialGradient id="bd-lamp"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffb066" stop-opacity="0"/></radialGradient>
        <radialGradient id="bd-spill" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8a6c4e" stop-opacity=".7"/><stop offset="1" stop-color="#8a6c4e" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1600" height="1000" fill="url(#bd-sw)"/>
      <g fill="url(#bd-win)" opacity=".62">
        <rect x="170" y="70" width="150" height="540" rx="4"/><rect x="334" y="70" width="150" height="540" rx="4"/><rect x="498" y="70" width="150" height="540" rx="4"/><rect x="662" y="70" width="150" height="540" rx="4"/>
      </g>
      <g fill="#14110e" opacity=".55"><rect x="170" y="300" width="642" height="10"/><rect x="170" y="430" width="642" height="8"/></g>
      <g fill="url(#bd-win)" opacity=".34"><rect x="1120" y="120" width="96" height="430" rx="4"/><rect x="1228" y="120" width="96" height="430" rx="4"/></g>
      <ellipse cx="560" cy="820" rx="560" ry="150" fill="url(#bd-spill)"/>
      <rect x="360" y="612" width="560" height="150" rx="48" fill="#0f0c0a" opacity=".86"/>
      <rect x="400" y="560" width="480" height="90" rx="40" fill="#1a1511" opacity=".9"/>
      <rect x="1010" y="680" width="380" height="30" rx="8" fill="#0d0b09" opacity=".9"/>
      <rect x="1040" y="708" width="16" height="140" fill="#0d0b09"/><rect x="1344" y="708" width="16" height="140" fill="#0d0b09"/>
      <circle cx="1440" cy="330" r="200" fill="url(#bd-lamp)" opacity=".55"/>
      <circle cx="1440" cy="330" r="46" fill="#ffe2b4" opacity=".75"/>
      <ellipse cx="1000" cy="560" rx="70" ry="130" fill="#141a12" opacity=".8"/>
    </svg>
    <div class="wisps"></div>
  </div>
  <div class="scene s-dusk">
    <svg viewBox="0 0 1600 440" preserveAspectRatio="none"><path d="M0 230 C 180 170 300 200 420 160 S 700 120 860 180 S 1160 110 1320 170 S 1520 150 1600 180 V440 H0Z" fill="#1d1916" opacity=".9"/><path d="M0 320 C 240 270 420 300 640 260 S 1040 300 1260 250 S 1500 280 1600 270 V440 H0Z" fill="#110f0d"/></svg>
  </div>
  <div class="scene s-liquid"><div class="blobs"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
  <div class="scene s-day"><div class="blobs"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
  <div class="photo"></div><div class="shade"></div>
</div>
<header>
  <h1>RF<span>/</span>RECON <small class="tag" style="font-size:10px;vertical-align:middle">BETA</small></h1>
  <button class="hbtn" id="missionChip" title="Mission">◎ <span id="missionName">No mission</span></button>
  <button class="hbtn" id="netChip" title="Connection &amp; data updates"><span class="led" id="netLed"></span><span id="netText">checking…</span></button>
  <span class="hint" id="meta" style="margin-left:auto"></span>
  <span id="lookSlot"></span>
  <button class="hbtn" id="themeBtn" title="Light / dark">◐</button>
</header>
<main>
  <section class="panel no-print" id="welcome" hidden></section>
  <section class="panel no-print" id="searchPanel">
    <div class="row">
      <div class="seg" id="modeSeg"><button data-m="point" class="on">Pin + radius</button><button data-m="county">County</button></div>
      <label class="grow" id="locWrap">Pin (lat, lon or Maps link — or click / drag on the map)
        <input id="loc" placeholder="38.8895, -77.0353"></label>
      <label>Radius (mi)<input id="radius" type="number" value="5" min="0.25" step="0.25" style="width:80px"></label>
      <label style="min-width:140px">&nbsp;<input id="radiusSlider" type="range" min="0.25" max="50" step="0.25" value="5"></label>
      <button id="gpsBtn" title="Use this device's GPS">◎ GPS</button>
      <span id="countyWrap" class="row" style="display:none">
        <label>State <select id="state"></select></label>
        <label>County <select id="county"></select></label>
      </span>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="grow">Search (licensee, call sign, city)<input id="q" placeholder="sheriff, WQ…, Fairfax"></label>
      <label>Freq from MHz<input id="fmin" type="number" step="any" style="width:100px"></label>
      <label>to<input id="fmax" type="number" step="any" style="width:100px"></label>
      <label class="inl"><input type="checkbox" id="hideMobile" checked> Fixed sites only</label>
      <button class="primary" id="go">Search</button>
    </div>
  </section>

  <section class="panel no-print" id="filters" style="display:none">
    <div class="row" style="justify-content:space-between">
      <div class="row" style="align-items:center;gap:10px"><strong id="resultCount"></strong><span class="hint" id="foldNote"></span></div>
      <div class="row">
        <button id="filterFold" aria-expanded="true" aria-controls="filterBody" title="Fold the filters away so the map gets the room"><span class="chev"></span><span class="lbl">Collapse</span></button>
        <button id="clearChips">Clear filters</button>
        <button id="csvBtn">⇩ CSV</button>
        <button id="kmlBtn">⇩ KML</button>
        <button id="takBtn" title="TAK data package for ATAK, iTAK and WinTAK: a marker per site, the search ring, and the heatmap when one is on">⇩ ATAK</button>
        <button id="takPush" title="Send what's on the map straight into ATAK, iTAK and WinTAK on this network (live markers that update when you push again), and open WinTAK">📡 Push to ATAK</button>
        <button id="printBtn">⎙ Prep sheet</button>
      </div>
    </div>
    <div id="filterBody"><div>
    <div class="fgroup"><h4>Layers — sources (click to show / hide everywhere)</h4><div class="chips" id="fLayer"></div></div>
    <div class="fgroup"><h4>Signal type</h4><div class="chips" id="fType"></div></div>
    <details id="moreFilters" class="fgroup"><summary class="hint" style="cursor:pointer">More filters — category, band, station type <span id="moreCount"></span></summary>
      <div class="fgroup"><h4>Category</h4><div class="chips" id="fCat"></div></div>
      <div class="fgroup"><h4>Band</h4><div class="chips" id="fBand"></div></div>
      <div class="fgroup"><h4>Station type</h4><div class="chips" id="fClass"></div></div></details>
    </div></div>
  </section>

  <div class="status" id="status">Drop a pin (or pick a county) and Search.</div>
  <div class="tabbar no-print">
  <nav class="tabs no-print" id="tabs">
    <button data-t="map" class="on">Map</button>
    <button data-t="find" title="Search everything RF Recon holds (Ctrl+K)">Search</button>
    <button data-t="report">Area report</button>
    <button data-t="analyzer">Analyzer</button>
    <button data-t="dashboard">Dashboard</button>
    <button data-t="topology">Topology</button>
    <button data-t="profile">Site profile</button>
    <button data-t="agencies">Agencies</button>
    <button data-t="spectrum">Spectrum</button>
    <button data-t="cells" title="Cell sites around the pin: global cell IDs, sectors, towers (crowd, survey and FCC data)">Cell sites</button>
    <button data-t="mission">Mission</button>
    <button data-t="das" title="In-building public safety radio (ERCES / DAS) jobs">DAS jobs</button>
    <button data-t="data">Data &amp; updates</button>
  </nav>
  </div>
  <section id="view"></section>
</main>
<dialog id="dlg"><div class="dlg-h"><strong id="dlgTitle"></strong><span style="flex:1"></span>
  <button onclick="document.getElementById('dlg').close()">✕</button></div><div class="dlg-b" id="dlgBody"></div></dialog>

<script>
// One Look button (skin, glass, motion) from the dashboard kit; ◐ still switches light / dark, and the two stay in step.
(function () {
  var root = document.documentElement;
  function fromTheme() {
    var t = root.dataset.theme;
    if (t === "light" && DashSkin.get() !== "day") DashSkin.set("day");
    else if (t === "dark" && DashSkin.get() === "day") DashSkin.set(DashSkin.lastDark());
  }
  new MutationObserver(fromTheme).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  DashLook.mount(document.getElementById("lookSlot"), {
    onChange: function (kind, value) {
      if (kind !== "skin") return;
      var t = value === "day" ? "light" : "dark";
      root.dataset.theme = t;
      try { localStorage.setItem("theme", t); } catch (e) {}
      if (typeof render === "function") render();
    }
  });
  fromTheme();
})();
</script>
