<title>DAStastic (beta)</title>
<link rel="icon" type="image/png" href="static/app/icons/icon-192.png">
<script>
// Opened straight from the folder (file://) there is no server behind the page: go to the running app, or say how to start it
if (location.protocol === "file:") {
  var rfApp = "http://localhost:8765/", rfHelp = function () {
    var show = function () { document.body.style.cssText = "margin:0;min-height:100vh;padding:1px 16px;background:#12110f";
      document.body.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:28px;border-radius:22px;background:#1f1b17;color:#f4efe8;font:16px/1.5 Segoe UI,system-ui,sans-serif">'
      + '<h1 style="margin:0 0 10px;font-size:26px">DAStastic (beta)</h1><p>This page runs from DAStastic\'s own small server on this PC, so it can\'t work opened from the folder.</p>'
      + '<p><a href="' + rfApp + '" style="color:#f0a07a;font-weight:700;font-size:19px">Open DAStastic (beta)</a> (when it\'s running)</p>'
      + '<p style="color:#c4bbaf">To start it, double-click <b>DAStastic (beta)</b> on the Desktop or in the Start menu (from an install kit: <b>Start DAStastic</b> in its folder). From Google Drive in the browser, open <b>START HERE - DAStastic (beta)</b> in the DAStastic folder.</p></div>'; };
    if (document.body) show(); else document.addEventListener("DOMContentLoaded", show);
  };
  fetch(rfApp + "api/meta", {mode: "no-cors"}).then(function () { location.replace(rfApp); }, rfHelp);
}
</script>

<script>
// The ◐ button's light / dark maps onto skins: light is Daylight, dark is the last dark skin (Smoke by default).
try { var t = localStorage.getItem("theme");
  if (t === "light") DashSkin.set("day"); else if (t === "dark" && DashSkin.get() === "day") DashSkin.set(DashSkin.lastDark());
  document.documentElement.dataset.theme = t || (DashSkin.get() === "day" ? "light" : "dark"); } catch (e) {}
</script>
<style>
/* colours come from the glass theme (static/theme/glass.css); these map DAStastic's names onto it */
:root, :root[data-skin]{
  --panel: var(--g-strong); --chip: var(--wash); --sel: var(--accent-wash); --muted: var(--ink-2);
  --accent-ink: var(--on-accent); --warn: var(--serious); --bad: var(--bad-ink);
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:1001;flex-wrap:wrap}
header h1{font-size:15px;margin:0;letter-spacing:.05em;font-family:var(--mono)}
header h1 span{color:var(--accent)}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.led{width:9px;height:9px;border-radius:50%;background:#8c959f;display:inline-block}
.led.on{background:#2da44e}.led.off{background:#cf222e}.led.busy{background:#bf8700}
main{max-width:1600px;margin:0 auto;padding:10px 14px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.inl{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
input,select,button,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
input[type=checkbox],input[type=radio]{padding:0;width:16px;height:16px;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}
button{cursor:pointer;background:var(--chip)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 11px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.grow{flex:1 1 200px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;user-select:none;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on b{color:inherit}
.chip.off{opacity:.45;text-decoration:line-through}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto;position:sticky;top:46px;background:var(--bg);z-index:1000}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 13px;white-space:nowrap;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.status{color:var(--muted);font-size:13px;margin:6px 0}
.status.err{color:var(--bad)}
.hint{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono)}
h3{font-size:12px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.card .v{font-size:21px;font-weight:650;font-family:var(--mono)}
.card .k{font-size:12px;color:var(--muted)}
/* panels keep their own height: stretched to a long neighbour they left up to 2,900 px of empty glass (11/3); a grid
   whose panel should fill (the pre-survey map) sets align-items:stretch itself */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;margin-top:10px;align-items:start}
.bars div{display:grid;grid-template-columns:150px 1fr 52px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.bars div[data-click]{cursor:pointer}
/* a wide table scrolls inside its panel, never the page (11/3: DAS report and design tables made phones 1,690 px wide) */
.grid2>*{min-width:0}
@media screen{ #dasPrint{overflow-x:auto} }
/* the topology legend sits under the graph (on top it hid 23-33 of 262 nodes on a phone, 11/3); full screen floats it */
#cyWrap:fullscreen .cyLegend{position:absolute;left:8px;bottom:8px;margin:0;opacity:.92}
/* dashboard charts are drawn 560 wide and shrink to fit: on a phone their 10-11 px text came out about 6 px (11/3) */
@media (max-width:600px){ svg.dchart{font-size:17px!important} }
/* DAS Prospects (dasprospects.js) */
.lead-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.lead-t{flex:1 1 320px;min-width:0}.lead-b{display:flex;flex-wrap:wrap;gap:6px}.lead-d{max-width:760px}
.lead-area{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}
#dsLeads h4{margin:12px 0 2px;font-size:14px}
.ap-next{margin:8px 0;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 12px 12px 0}
.ap-next ol{margin:4px 0;padding-left:20px}.ap-next .hint{margin:4px 0 8px}
.pr-tab td{vertical-align:top}.pr-tab td .hint{font-size:11.5px}.pr-dnc{opacity:.55}
.pr-tab tr.pr-hit td{background:color-mix(in srgb,var(--accent,#3b82f6) 22%,transparent);transition:background .3s}
.status.pr-warn{color:var(--warn);border-color:var(--warn)}
/* DAS Pitch (daspitch.js): slides on screen, one landscape page each in print */
.pitch-deck{display:flex;flex-direction:column;gap:14px}
.pitch-slide{position:relative;aspect-ratio:16/9;min-height:420px;padding:28px 34px 40px;border-radius:14px;overflow:auto;
  background:linear-gradient(var(--g-tint),var(--g-tint)),var(--g-strong,var(--panel));border:1px solid var(--line);box-shadow:var(--g-shadow)}
.pitch-slide h1{font-size:40px;margin:0 0 10px}.pitch-slide h2{font-size:24px;margin:0 0 12px}.pitch-slide h3{font-size:15px;margin:6px 0}
.pitch-slide .lead{font-size:17px;line-height:1.5;max-width:70em}
.pitch-slide footer{position:absolute;left:34px;right:34px;bottom:12px;font-size:11px;color:var(--muted)}
.pitch-cover{display:flex;align-items:center}
.pitch-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pitch-cards>div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:12.5px}.pitch-cards p{margin:4px 0}
.pitch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;font-size:13px}
.pitch-steps{columns:2;column-gap:28px;font-size:12.5px;margin:0;padding-left:18px}.pitch-steps li{break-inside:avoid;margin-bottom:6px}
.pitch-sources ol{font-size:10.5px;columns:2;column-gap:24px}.pitch-slide sup a{text-decoration:none;margin-left:1px}
.pitch-slide dt{font-weight:600;margin-top:6px}.pitch-slide dd{margin:2px 0 0 0}
@media print{ body.print-das #dasPrint.pitch-deck .pitch-slide{aspect-ratio:auto;min-height:0;height:auto;overflow:visible;break-after:page;border:0;box-shadow:none;background:#fff;color:#000}
  body.print-das #dasPrint.pitch-deck .pitch-slide footer{position:static;margin-top:14px} }
@page{size:auto}
/* low items from the 11/3 sweep */
.res-pass{color:var(--good-ink,#1a7f37)} .res-fail{color:var(--bad-ink,#cf222e)}  /* the skin's own ink on screen (the print colours were 3.6:1 on dark) */
@media print{ .res-pass{color:#1a7f37!important} .res-fail{color:#cf222e!important} }
.bars div > span.mono{white-space:nowrap}  /* "110 38%" stayed on two lines on a phone */
@media (max-width:900px){ .bars div{grid-template-columns:100px 1fr 62px} }
#view{padding-bottom:72px}  /* the floating Note button never covers the last of a page */
@media (pointer:coarse){
  .bars div[data-click]{min-height:32px}
  details > summary{padding-top:7px;padding-bottom:7px}

}
.bars div.full > span:first-child{white-space:normal!important;overflow:visible!important}  /* tapped: the whole name */
.bars .bar{height:10px;border-radius:3px;background:var(--accent)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.sf-wrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:start;margin-top:8px}.sf-roots{display:grid;gap:4px}
.sf-roots button{text-align:left}.sf-roots button.on{background:var(--accent);color:var(--accent-ink)}
.sf-go{background:none;background-image:none;border:0;border-radius:0;box-shadow:none;padding:0;min-height:0;min-width:0;color:inherit;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.sf-crumb{margin:0 0 6px;overflow-wrap:anywhere}.sf-wrap a.hbtn{text-decoration:none;white-space:nowrap}.sf-wrap td{vertical-align:middle}
@media(max-width:700px){.sf-wrap{grid-template-columns:minmax(0,1fr)}.sf-roots{grid-template-columns:repeat(2,minmax(0,1fr))}.sf-go{min-height:32px}}
table{border-collapse:collapse;width:100%;font-size:12.5px}

th{position:sticky;top:0;background:var(--panel);font-weight:600;color:var(--muted);font-size:11.5px;z-index:1}

.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.legend{background:var(--panel);color:var(--ink);padding:6px 8px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;max-width:240px}
.legend .bar{height:8px;border-radius:3px;background:linear-gradient(90deg,#30123b,#466be3,#29bbec,#31f198,#a3fd3d,#edd03a,#fb8022,#b40426)}

.pane2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tree{font-family:var(--mono);font-size:12px;height:30vh;overflow:auto;padding:6px 8px}

.w12{grid-column:span 12}.w8{grid-column:span 8}.w6{grid-column:span 6}.w4{grid-column:span 4}
#dashmap{height:360px;border-radius:8px}
svg text{fill:var(--muted);font-size:10px;font-family:system-ui,sans-serif}
#cy{height:calc(100vh - 260px);min-height:480px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:820px;width:calc(100% - 20px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-b{padding:11px 15px;max-height:78vh;overflow:auto}
.kvg{display:grid;grid-template-columns:170px 1fr;gap:3px 12px;font-size:13px}
.kvg div:nth-child(odd){color:var(--muted)}
.sec{margin-top:12px}
.srcrow{display:grid;grid-template-columns:44px minmax(160px,1.4fr) 120px 1.3fr 80px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.switch{position:relative;width:38px;height:22px;display:inline-block;flex:none}

.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(16px)}
.log{max-height:300px;overflow:auto;font-size:12.5px}
.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.print-only{display:none}
@media (max-width:900px){
  .mapwrap{grid-template-columns:1fr}
  #map{height:58vh}.side{height:auto;max-height:60vh}
  .w8,.w6,.w4{grid-column:span 12}
  .pane2{grid-template-columns:1fr}
  .srcrow{grid-template-columns:44px 1fr 80px}
  .srcrow .hide-m{display:none}

/* Phones in the field (and gloves): every control at least 44px to tap. Look score had 0-1 of 38-54 at 390px. */
@media (pointer:coarse), (max-width:600px){
  button,select,input:not([type=checkbox]):not([type=radio]):not([type=range]),.chip,.tabs button,.seg button{min-height:44px}

  body.print-prep .print-only{display:block}
  body.print-prep #view > *:not(#printSheet){display:none!important}
  #work{display:block!important}
}

<script>
// One Look button (skin, glass, motion) from the dashboard kit; ◐ still switches light / dark, and the two stay in step.
(function () {
  var root = document.documentElement;
  function fromTheme() {
    var t = root.dataset.theme;
    if (t === "light" && DashSkin.get() !== "day") DashSkin.set("day");
    else if (t === "dark" && DashSkin.get() === "day") DashSkin.set(DashSkin.lastDark());
  }
  new MutationObserver(fromTheme).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  DashLook.mount(document.getElementById("lookSlot"), {
    onChange: function (kind, value) {
      if (kind !== "skin") return;
      var t = value === "day" ? "light" : "dark";
      root.dataset.theme = t;
      try { localStorage.setItem("theme", t); } catch (e) {}
      if (typeof render === "function") render();
    }
  });
  fromTheme();
})();
</script>
