<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Test report review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;--ink:#f3ece6;--dim:#b9aea6;--accent:#f0a37a;--line:rgba(255,255,255,.13);--glass:rgba(30,26,22,.62);
  --ok:#7fd49a;--bad:#ff8f7a;--warn:#f2c46b}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font:15px/1.5 Urbanist,system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 80% 0%,#5a3b2b 0,transparent 60%),radial-gradient(900px 600px at 0% 100%,#2b2f3d 0,transparent 60%),#17140f;background-attachment:fixed}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:rgba(23,20,15,.72);backdrop-filter:blur(16px) saturate(1.2)}
header h1{margin:0;font-size:17px;letter-spacing:.03em;font-weight:700}
header .who{margin-left:auto;color:var(--dim);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.panel{margin:0 0 16px;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:var(--glass);
  backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 14px 40px rgba(0,0,0,.32)}
.panel h2{margin:0 0 10px;font-size:17px}
.panel h3{margin:14px 0 6px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.hint{color:var(--dim);font-size:13px}
#rvLive .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:4px;vertical-align:middle;animation:rvPulse 2s ease-in-out infinite}
@keyframes rvPulse{50%{opacity:.35}} @media (prefers-reduced-motion:reduce){#rvLive .dot{animation:none}}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line)}
.chip.accepted,.chip.pass{background:rgba(127,212,154,.16);color:var(--ok);border-color:rgba(127,212,154,.4)}
.chip.returned,.chip.fail{background:rgba(255,143,122,.15);color:var(--bad);border-color:rgba(255,143,122,.4)}
.chip.waiting{background:rgba(242,196,107,.13);color:var(--warn);border-color:rgba(242,196,107,.35)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
button,.btn{min-height:36px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
  font:600 14px Urbanist,system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:filter .2s,background .2s}
button:hover,.btn:hover{background:rgba(255,255,255,.12)}
button.primary{background:var(--accent);color:#2a160c;border-color:transparent}
button.bad{background:rgba(255,143,122,.18);color:var(--bad);border-color:rgba(255,143,122,.45)}
button:disabled{opacity:.5;cursor:default}
textarea{width:100%;min-height:84px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);font:inherit;resize:vertical}
textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list a.job{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.list a.job:last-child{border-bottom:0}
.list a.job:hover b{color:var(--accent)}
.thread{list-style:none;margin:0;padding:0}
.thread li{padding:10px 0;border-bottom:1px solid var(--line)}
.thread li:last-child{border-bottom:0}
.err{padding:10px 12px;border-radius:12px;background:rgba(220,80,60,.18);border:1px solid rgba(220,80,60,.4)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 8px}
.stats div b{display:block;font-size:20px}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:32px;display:flex;align-items:center}
@media (max-width:600px){main{padding:14px 10px 40px}.panel{padding:14px 14px;border-radius:16px}header{padding:10px 12px}header h1{font-size:15px}
  th,td{padding:6px 7px}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{background:#fff;color:#111}header,.no-print{display:none}.panel{background:#fff;border-color:#bbb;box-shadow:none;backdrop-filter:none}
  .hint,th,.kv dt{color:#444}a{color:#111}}
</style>
</head>
<body>
<header><h1 id="rvTitle">Test report review</h1><div class="who" id="rvWho"></div></header>
<main id="rvMain"><p class="hint">Loading…</p></main>
<script>
// helpers das.js expects from the main app, so its grid scoring (floorStats, gridPass, dasProfile) runs here as in the report
var S = {views: {}, das: {contacts: []}, build: {}};
var $ = function (s) { return document.querySelector(s); }, $$ = function (s) { return Array.from(document.querySelectorAll(s)); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); };
var num = function (v, d) { return v == null || v === "" || isNaN(v) ? "" : Number(v).toFixed(d || 0); };
</script>
<script src="/static/das.js" onerror="window.dasScoringMissing=true"></script>
<script src="/static/account.js"></script>
<script src="/static/dasreview.js"></script>
</body>
</html>
