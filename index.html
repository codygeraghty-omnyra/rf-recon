<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RF Recon (beta)</title>
<meta name="description" content="RF Recon (beta) for phones: FCC licences, towers, broadcast, NOAA and FAA for one area, offline.">
<meta name="theme-color" content="#12110f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RF Recon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="theme/glass.css">
<script src="theme/skins.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.4; color: var(--ink); background: transparent;
  overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 13px; }
[hidden] { display: none !important; }
/* panels that float over the map use the strong glass: a white topo map behind clear glass would wash the text out */
.over { background: linear-gradient(var(--g-tint), var(--g-tint)), var(--g-strong); }

/* ---------- map ---------- */
#map { position: fixed; inset: 0; z-index: 0; background: var(--bg); }
body:not([data-tab="map"]) #map { visibility: hidden; }
.leaflet-container { font-family: var(--font); background: var(--bg); }
.leaflet-bottom { bottom: calc(env(safe-area-inset-bottom) + 76px); }
.leaflet-control-attribution { background: var(--pill) !important; color: var(--ink-2) !important; border-radius: 8px 0 0 0; font-size: 10px; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }
.pin { filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.me { width: 16px; height: 16px; border-radius: 50%; background: #3d8bfd; border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(61,139,253,.6); animation: me 2s var(--ease) infinite; }
@keyframes me { 70% { box-shadow: 0 0 0 14px rgba(61,139,253,0); } 100% { box-shadow: 0 0 0 0 rgba(61,139,253,0); } }

/* ---------- top bar, search, chips ---------- */
.top { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 8px); left: 10px; right: 10px; height: 48px;
  border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 8px; }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.brand img { width: 28px; height: 28px; border-radius: 8px; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 6px; border-radius: 999px; background: var(--accent-wash); color: var(--accent); }
.packchip { flex: 1; min-width: 0; height: 34px; border-radius: 999px; border: 1px solid var(--g-border); background: var(--wash);
  padding: 0 12px; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; cursor: pointer;
  transition: background var(--t-hover) ease; }
.packchip:hover { background: var(--wash-2); }
.search { position: fixed; z-index: 25; top: calc(env(safe-area-inset-top) + 64px); left: 10px; right: 10px; height: 50px; border-radius: 999px;
  display: flex; align-items: center; gap: 4px; padding: 0 5px 0 16px; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; height: 44px; }
.search input::placeholder { color: var(--muted); }
body:not([data-tab="map"]) .search, body:not([data-tab="map"]) .mapchips, body:not([data-tab="map"]) #suggest { display: none !important; }
.ibtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; cursor: pointer;
  color: var(--ink-2); transition: background var(--t-hover) ease, color var(--t-hover) ease; }
.ibtn:hover, .ibtn:active { background: var(--wash-2); color: var(--ink); }
.ibtn.on { color: var(--accent); }
#suggest { position: fixed; z-index: 26; top: calc(env(safe-area-inset-top) + 120px); left: 10px; right: 10px; border-radius: 20px; padding: 6px; max-height: 50vh; overflow: auto; }
#suggest button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; border: 0; background: none; padding: 11px 12px; border-radius: 14px; cursor: pointer; }
#suggest button:hover, #suggest button:focus { background: var(--wash-2); outline: none; }
#suggest .k { color: var(--muted); font-size: 12px; min-width: 64px; }
.mapchips { position: fixed; z-index: 24; top: calc(env(safe-area-inset-top) + 122px); left: 10px; right: 10px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
.mapchips > * { pointer-events: auto; }
.pill { height: 36px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; padding: 0 13px; font-size: 13px; border: 1px solid var(--g-border); white-space: nowrap; cursor: pointer; }
.pill select { border: 0; background: none; outline: none; font-size: 13px; appearance: none; -webkit-appearance: none; padding-right: 2px; cursor: pointer; }
.pill select option { color: #111; }
#summary { min-width: 0; overflow: hidden; text-overflow: ellipsis; cursor: default; }
.spacer { flex: 1; }

/* ---------- pages (list, report, log, packs) ---------- */
#page { position: fixed; inset: 0; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + 70px) 14px calc(env(safe-area-inset-bottom) + 96px); }
body[data-tab="map"] #page { display: none; }
.head h1 { margin: 6px 4px 2px; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; }
.head p { margin: 4px 4px 14px; color: var(--ink-2); }
.card { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; animation: rise var(--t-panel) var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.kpi { border-radius: 18px; padding: 12px; animation: rise var(--t-panel) var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.kpi .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .k { font-size: 12px; color: var(--muted); margin-top: 3px; }
.btn { min-height: 42px; border-radius: 999px; border: 1px solid var(--g-border); background: var(--wash); padding: 0 16px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background var(--t-hover) ease, transform var(--t-move) var(--ease); }
.btn:hover { background: var(--wash-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.danger { color: var(--bad-ink); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 34px; border-radius: 999px; border: 1px solid var(--g-border); background: var(--wash); padding: 0 12px; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: background var(--t-hover) ease, color var(--t-hover) ease; }
.chip.on { background: var(--ink); color: var(--bg); border-color: transparent; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.empty { text-align: center; padding: 26px 16px; }
.empty p { color: var(--ink-2); margin: 6px 0 14px; }

/* result rows */
.item { display: flex; gap: 10px; align-items: flex-start; padding: 11px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.item:first-child { border-top: 0; }
.item .dot { margin-top: 6px; }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 13px; color: var(--ink-2); }
.item .f { font-family: var(--mono); font-size: 14px; text-align: right; white-space: nowrap; }
.item .f small { display: block; font-family: var(--font); color: var(--muted); font-size: 12px; }

/* tables */
.tw { overflow-x: auto; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 8px; border-radius: 4px; overflow: hidden; display: flex; background: var(--wash); margin-top: 4px; }
details summary { cursor: pointer; padding: 10px 2px; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details summary::-webkit-details-marker { display: none; }
details + details { border-top: 1px solid var(--line); }

/* key-value grid */
.kv { display: grid; grid-template-columns: minmax(96px, 38%) 1fr; gap: 5px 12px; font-size: 14px; margin: 8px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- sheet, scrim, toast, nav ---------- */
#scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); animation: fade var(--t-panel) ease both; }
@keyframes fade { from { opacity: 0; } }
#sheet { position: fixed; z-index: 41; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); max-height: 80dvh; border-radius: 24px;
  display: flex; flex-direction: column; animation: up var(--t-panel) var(--ease) both; }
@keyframes up { from { transform: translateY(105%); } }
#sheet .sh { display: flex; align-items: flex-start; gap: 8px; padding: 14px 8px 6px 18px; }
#sheet .sh h3 { margin: 4px 0 0; font-size: 19px; line-height: 1.2; }
#sheet .sh .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 3px; }
#sheet .sb { overflow-y: auto; padding: 4px 18px 18px; -webkit-overflow-scrolling: touch; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { font-size: 16px; min-height: 44px; border-radius: 14px; border: 1px solid var(--g-border); background: var(--wash);
  padding: 8px 12px; outline: none; transition: border-color var(--t-border) ease; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field select option { color: #111; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > *, .field input, .field select, .field textarea { min-width: 0; width: 100%; }
.check { border-radius: 14px; padding: 10px 12px; font-size: 14px; margin-top: 6px; background: var(--wash); border-left: 4px solid var(--muted); }
.check.licensed { border-left-color: #3ccf7a; }
.check.allowed { border-left-color: #a78bfa; }
.check.unlisted { border-left-color: #e5534b; }
.check.outside { border-left-color: #fab219; }
#toast { position: fixed; z-index: 50; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 84px); border-radius: 18px; padding: 10px 10px 10px 16px;
  display: flex; gap: 10px; align-items: center; animation: rise var(--t-move) var(--ease) both; }
#toast span { flex: 1; font-size: 14px; }
#nav { position: fixed; z-index: 30; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); height: 62px; border-radius: 999px;
  display: grid; grid-template-columns: repeat(6, 1fr); padding: 5px; gap: 2px; }
#nav button { border: 0; background: none; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; color: var(--ink-2); cursor: pointer; transition: background var(--t-hover) ease, color var(--t-hover) ease; }
#nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }
#nav svg { width: 21px; height: 21px; }
.loading { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--scrim); }
.loading div { border-radius: 20px; padding: 18px 22px; }
@media (min-width: 720px) {
  #page { padding-left: calc(50vw - 340px); padding-right: calc(50vw - 340px); }
  #sheet { left: calc(50vw - 300px); right: calc(50vw - 300px); }
  #nav { left: calc(50vw - 260px); right: calc(50vw - 260px); }
}
</style>
</head>
<body data-tab="map">
<div id="backdrop" aria-hidden="true">

    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="bd-sw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14110e"/><stop offset=".62" stop-color="#2b231b"/><stop offset=".64" stop-color="#3a2f24"/><stop offset="1" stop-color="#16120e"/></linearGradient>
        <linearGradient id="bd-win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6dccb"/><stop offset="1" stop-color="#b9a68a"/></linearGradient>
        <radialGradient id="bd-lamp"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffb066" stop-opacity="0"/></radialGradient>
        <radialGradient id="bd-spill" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8a6c4e" stop-opacity=".7"/><stop offset="1" stop-color="#8a6c4e" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1600" height="1000" fill="url(#bd-sw)"/>
      <g fill="url(#bd-win)" opacity=".62">
        <rect x="170" y="70" width="150" height="540" rx="4"/><rect x="334" y="70" width="150" height="540" rx="4"/><rect x="498" y="70" width="150" height="540" rx="4"/><rect x="662" y="70" width="150" height="540" rx="4"/>
      </g>
      <g fill="#14110e" opacity=".55"><rect x="170" y="300" width="642" height="10"/><rect x="170" y="430" width="642" height="8"/></g>
      <g fill="url(#bd-win)" opacity=".34"><rect x="1120" y="120" width="96" height="430" rx="4"/><rect x="1228" y="120" width="96" height="430" rx="4"/></g>
      <ellipse cx="560" cy="820" rx="560" ry="150" fill="url(#bd-spill)"/>
      <rect x="360" y="612" width="560" height="150" rx="48" fill="#0f0c0a" opacity=".86"/>
      <rect x="400" y="560" width="480" height="90" rx="40" fill="#1a1511" opacity=".9"/>
      <rect x="1010" y="680" width="380" height="30" rx="8" fill="#0d0b09" opacity=".9"/>
      <rect x="1040" y="708" width="16" height="140" fill="#0d0b09"/><rect x="1344" y="708" width="16" height="140" fill="#0d0b09"/>
      <circle cx="1440" cy="330" r="200" fill="url(#bd-lamp)" opacity=".55"/>
      <circle cx="1440" cy="330" r="46" fill="#ffe2b4" opacity=".75"/>
      <ellipse cx="1000" cy="560" rx="70" ry="130" fill="#141a12" opacity=".8"/>
    </svg>
    <div class="wisps"></div>
  </div>
  <div class="scene s-dusk">
    <svg viewBox="0 0 1600 440" preserveAspectRatio="none"><path d="M0 230 C 180 170 300 200 420 160 S 700 120 860 180 S 1160 110 1320 170 S 1520 150 1600 180 V440 H0Z" fill="#1d1916" opacity=".9"/><path d="M0 320 C 240 270 420 300 640 260 S 1040 300 1260 250 S 1500 280 1600 270 V440 H0Z" fill="#110f0d"/></svg>
  </div>
  <div class="scene s-liquid"><div class="blobs"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
  <div class="scene s-day"><div class="blobs"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
  <div class="photo"></div><div class="shade"></div>
</div>

<div id="map" aria-label="Map"></div>

<header class="top glass over">
  <span class="brand"><img src="icons/icon-192.png" alt="">RF Recon <span class="badge">BETA</span></span>
  <button class="packchip" id="packchip" type="button" title="Data packs">No data pack</button>
  <span id="lookSlot"></span>
</header>

<form class="search glass over" id="searchForm" role="search" autocomplete="off">
  <input id="q" type="search" enterkeyhint="search" placeholder="Place, frequency or name" aria-label="Search">
  <button class="ibtn" type="button" id="filterBtn" title="Layers and filters" aria-label="Layers and filters"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  <button class="ibtn" type="button" id="locateBtn" title="Where I am" aria-label="Where I am"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</form>
<div id="suggest" class="glass over" hidden></div>
<div class="mapchips">
  <span class="pill glass over" id="summary">Tap the map or search</span>
  <label class="pill glass over" title="Radius">◎ <select id="radius" aria-label="Radius"></select></label>
  <span class="spacer"></span>
  <button class="pill glass over" type="button" id="logBtn">＋ Log</button>
</div>

<main id="page" aria-live="polite"></main>

<nav id="nav" class="glass over" aria-label="Sections">
  <button type="button" data-t="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  <button type="button" data-t="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor"/></svg>List</button>
  <button type="button" data-t="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Report</button>
  <button type="button" data-t="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Log</button>
  <button type="button" data-t="das"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5l8-3 8 3v16"/><path d="M4 21h16M9 21v-4h6v4M8 8h2M14 8h2M8 12h2M14 12h2"/></svg>DAS</button>
  <button type="button" data-t="packs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Packs</button>
</nav>

<div id="scrim" hidden></div>
<section id="sheet" class="glass over" role="dialog" aria-modal="true" hidden></section>
<div id="toast" class="glass over" role="status" hidden></div>
<input type="file" id="packfile" hidden>
